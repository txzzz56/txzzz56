<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Mumtaz A Cade – Fullstack-utvikler, maskinlæring og forretningsanalyse. IT og informasjonssystemer ved USN.">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .name  { fill: #ffffff; font-size: 50px; font-weight: 800; letter-spacing: 4px; }
    .title { fill: #ffffff; font-size: 23px; font-weight: 600; letter-spacing: .5px; }
    .sep   { fill: #e9b8ff; }
    .sub   { fill: #e2cdff; font-size: 16px; letter-spacing: .5px; }
    .orb  { animation: drift 9s ease-in-out infinite alternate; }
    .orb2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes drift { from { transform: translate(0,0) } to { transform: translate(40px,-14px) } }
    @keyframes shine { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f4f"/><stop offset=".55" stop-color="#5b21b6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="o" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e9b8ff" stop-opacity=".55"/><stop offset="1" stop-color="#e9b8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <circle class="orb" cx="770" cy="40" r="150" fill="url(#o)"/>
    <circle class="orb2" cx="90" cy="230" r="130" fill="url(#o)"/>
    <rect class="shine" x="0" y="236" width="900" height="4" fill="#e9b8ff"/>
  </g>
  <text x="450" y="92" text-anchor="middle" class="sans name">MUMTAZ A CADE</text>
  <rect x="380" y="112" width="140" height="2" rx="1" fill="#e9b8ff" opacity=".7"/>
  <text x="450" y="152" text-anchor="middle" class="sans title">Fullstack-utvikler <tspan class="sep">|</tspan> Maskinlæring og forretningsanalyse</text>
  <text x="450" y="190" text-anchor="middle" class="sans sub">IT og informasjonssystemer ved USN  ·  React · Node.js · Java · Python · SQL</text>
</svg>
